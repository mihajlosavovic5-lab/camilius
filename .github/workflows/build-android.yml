name: Build signed Android APK

# Manual only - a signed release build isn't something we want firing on every push,
# and it needs the keystore secrets below configured on the repo first
# (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64     - `base64 -w0 signing.keystore` of the saved keystore
#   ANDROID_KEYSTORE_PASSWORD   - same value as the key password (one password for both)
#   ANDROID_KEY_ALIAS           - camilius-key-alias
#   ANDROID_KEY_PASSWORD        - same as the keystore password
#   GOOGLE_SERVICES_JSON_BASE64 - `base64 -w0 google-services.json` from the Firebase
#                                 console (needed for push notifications) - like the
#                                 keystore, never committed to the repo
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Copies mobile/ (the app's web assets) and capacitor.config.json into the native
      # Android project - must run before Gradle so the APK bundles the current app, not
      # whatever was last synced.
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # capacitor-android's module targets Java 21 source/target compatibility

      # Puts the Android SDK's cmdline-tools (sdkmanager etc.) on PATH and accepts licenses -
      # the hosted runner's preinstalled SDK doesn't always have the newest compileSdk
      # platform, so install it explicitly rather than assume.
      - uses: android-actions/setup-android@v3

      - name: Ensure required Android SDK platform is installed
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/signing.keystore

      # Enables the Google Services Gradle plugin (see android/app/build.gradle's
      # conditional apply) so the app can actually receive push notifications - without
      # this file present, FCM registration silently no-ops instead of failing loudly.
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=signing.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Play Store submissions need an Android App Bundle, not an APK - same signing
      # config (android/app/build.gradle's release buildType) is reused automatically,
      # so this produces a .aab signed with the same key as the APK above.
      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # Confirms this build is signed with the same key as every prior release (fingerprint
      # must match /.well-known/assetlinks.json in app.py) - printed in the logs so it can be
      # checked without needing the Android SDK locally.
      - name: Print signing certificate fingerprint
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: camilius-ai-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: camilius-ai-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # static/camilius-ai.apk (served by app.py's /download/camilius-ai.apk, and what
      # the in-app "new version available" banner links to) used to just sit there
      # unchanged after this workflow ran - the artifact above was uploaded for manual
      # download but nobody was reliably re-fetching it and committing it back, so the
      # distributed binary drifted further out of date every release. This closes that
      # gap: same build, published straight to the ref that triggered the workflow.
      # The build above takes several minutes, so the ref can move upstream in the
      # meantime - a plain push here races that and gets rejected as non-fast-forward.
      # Rebase onto the latest ref just before pushing, and retry a few times in case
      # something lands again in that window.
      - name: Publish rebuilt APK to static/camilius-ai.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk static/camilius-ai.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/camilius-ai.apk
          if git diff --cached --quiet; then
            echo "APK unchanged - nothing to publish"
            exit 0
          fi
          git commit -m "Publish freshly built signed APK"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto latest ${{ github.ref_name }} and retrying"
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }}
          done
          echo "::error::Failed to push rebuilt APK after multiple attempts"
          exit 1

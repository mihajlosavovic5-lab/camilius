[pytest]
# Only collect tests from tests/ - the repo root also has a couple of pre-existing,
# unrelated manual debug scripts named test_env.py/test_openai.py (quick "is my API key
# loaded / does a real OpenAI call work" checks, not pytest tests) that pytest's default
# test_*.py discovery would otherwise pick up and try to import, which for
# test_openai.py means firing a real (and here, since it's CI, always-failing) OpenAI
# API call at collection time.
testpaths = tests

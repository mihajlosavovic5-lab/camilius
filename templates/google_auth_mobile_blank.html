<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camilius</title>
<style>html, body { margin: 0; height: 100%; background: #fdfaf4; }
@media (prefers-color-scheme: dark) { html, body { background: #1c1a17; } }</style>
<script>
    // A matching account was found - the app already gets its own token straight from
    // polling /api/google-login/status (see mobile/app.js) and closes this same browser
    // tab itself (Browser.close()) the moment that poll resolves, usually well under two
    // seconds. There's nothing for a visitor to read or act on here, so unlike
    // google_auth_mobile_result.html (used for the needs-signup/no-account/failure cases,
    // which DO need to say something) this is a deliberately bare, resource-free page -
    // no CSS/JS/fonts/base-layout chrome to load or paint - so the brief moment before
    // either close fires is as close to invisible as a real redirect through the browser
    // can be, instead of a flash of the site's full header/logo/banners.
    try { window.close(); } catch (e) {}
</script>
</head>
<body></body>
</html>

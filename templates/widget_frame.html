<!doctype html>
<!--
    F5: the embeddable widget's own iframe content, served at GET /w/<slug> and loaded
    by the small loader script at GET /widget.js on a business's OWN external site. Not
    the same template as public_page.html's inline widget markup, even though the UI is
    nearly identical - this one fills 100% of a small resizable iframe rather than
    floating fixed over a whole viewport (the *parent* page owns that positioning, via
    widget.js resizing the <iframe> element itself), and it postMessages its open/closed
    state back to the parent so widget.js knows how big to make the iframe. See app.py's
    widget_frame()/set_security_headers - the CSP frame-ancestors this page is served
    with is the actual security boundary controlling who's allowed to embed it at all;
    this template has no opinion on that.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<meta name="robots" content="noindex, nofollow">
<style>
    :root {
        --primary: {{ theme.base.primary }};
        --on-primary: {{ theme.base.on_primary }};
        --surface: {{ theme.base.surface }};
        --text: {{ theme.base.text }};
        --text-muted: {{ theme.base.text_muted }};
        --border: {{ theme.base.border }};
        --background: {{ theme.base.background }};
        --radius: {{ theme.radius }};
    }
    {% if theme.dark %}
    @media (prefers-color-scheme: dark) {
        :root {
            --primary: {{ theme.dark.primary }};
            --on-primary: {{ theme.dark.on_primary }};
            --surface: {{ theme.dark.surface }};
            --text: {{ theme.dark.text }};
            --text-muted: {{ theme.dark.text_muted }};
            --border: {{ theme.dark.border }};
            --background: {{ theme.dark.background }};
        }
    }
    {% endif %}
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    a, button { -webkit-appearance: none; appearance: none; }
    html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        overflow: hidden;
    }
    .widget-fab {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        background: var(--primary);
        color: var(--on-primary);
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform .18s cubic-bezier(.2, .9, .3, 1.3);
    }
    .widget-fab:hover { transform: scale(1.06); }
    .widget-fab svg {
        width: 23px;
        height: 23px;
    }
    .widget-panel {
        position: absolute;
        inset: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 2px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .widget-panel.hidden {
        display: none;
    }
    .widget-header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 11px;
        background: linear-gradient(160deg, color-mix(in srgb, var(--primary) 14%, var(--surface)) 0%, var(--surface) 130%);
    }
    .widget-header-avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--primary);
        color: var(--on-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    }
    .widget-header-avatar svg {
        width: 17px;
        height: 17px;
    }
    .widget-header-text {
        min-width: 0;
    }
    .widget-header p {
        margin: 0;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .widget-close {
        margin-left: auto;
        border: none;
        background: none;
        font-size: 1.3rem;
        line-height: 1;
        cursor: pointer;
        color: var(--text-muted);
        padding: 4px 6px;
        flex-shrink: 0;
        border-radius: 8px;
        transition: background .12s ease, color .12s ease;
    }
    .widget-close:hover {
        background: color-mix(in srgb, var(--text) 8%, transparent);
        color: var(--text);
    }
    .widget-messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--background);
    }
    .widget-msg {
        max-width: 85%;
        padding: 9px 12px;
        border-radius: 16px;
        font-size: 0.92rem;
        line-height: 1.4;
        white-space: pre-line;
        overflow-wrap: break-word;
    }
    .widget-msg-user {
        align-self: flex-end;
        background: var(--primary);
        color: var(--on-primary);
        border-bottom-right-radius: 4px;
        box-shadow: 0 2px 6px color-mix(in srgb, var(--primary) 35%, transparent);
    }
    .widget-msg-bot {
        align-self: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
    }
    .widget-msg-typing {
        opacity: 0.6;
    }
    .widget-form {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--border);
        background: var(--surface);
    }
    .widget-form input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 10px 15px;
        font-size: 0.92rem;
        background: var(--background);
        color: var(--text);
        min-width: 0;
        transition: border-color .12s ease, box-shadow .12s ease;
    }
    .widget-form input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
    }
    .widget-form button {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        border: 1.5px solid var(--primary);
        border-radius: 50%;
        background: var(--surface);
        color: var(--primary);
        padding: 0;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .12s ease, border-color .12s ease, transform .12s ease;
    }
    .widget-form button:hover {
        transform: scale(1.05);
    }
</style>
</head>
<body>
<button type="button" class="widget-fab" id="widget-fab" aria-label="Chat with {{ business_name }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20.5c0-4.14 3.58-7.5 8-7.5s8 3.36 8 7.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</button>
<div class="widget-panel hidden" id="widget-panel">
    <div class="widget-header">
        <span class="widget-header-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20.5c0-4.14 3.58-7.5 8-7.5s8 3.36 8 7.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        <div class="widget-header-text">
            <p>{{ business_name }}</p>
        </div>
        <button type="button" class="widget-close" id="widget-close" aria-label="Close">&times;</button>
    </div>
    <div class="widget-messages" id="widget-messages"></div>
    <form class="widget-form" id="widget-form">
        <input type="text" id="widget-input" placeholder="Ask a question or book a time..." autocomplete="off">
        <button type="submit" aria-label="Send">&#10148;</button>
    </form>
</div>
<script>
(function () {
    var fab = document.getElementById("widget-fab");
    var panel = document.getElementById("widget-panel");
    var closeBtn = document.getElementById("widget-close");
    var messagesEl = document.getElementById("widget-messages");
    var form = document.getElementById("widget-form");
    var input = document.getElementById("widget-input");
    var chatUrl = {{ chat_url | tojson }};
    // The exact origin widget.js's loader script was fetched from on the business's own
    // site - this page is only ever meant to run inside an iframe there (see
    // app.py's widget_frame()/set_security_headers, which is the actual boundary
    // enforcing that), so targeting postMessage at "*" would just be needless - "*"
    // only kicks in for the harmless case of someone opening /w/<slug> directly, where
    // window.parent === window and this message never leaves the page anyway.
    var parentOrigin = {{ widget_domain | tojson }} || "*";
    var open = false;
    var greeted = false;

    var SESSION_KEY = "camilius_widget_chat_" + {{ slug | tojson }};
    var sessionId;
    try {
        sessionId = localStorage.getItem(SESSION_KEY);
        if (!sessionId) {
            sessionId = "web:" + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now());
            localStorage.setItem(SESSION_KEY, sessionId);
        }
    } catch (e) {
        sessionId = "web:" + Date.now() + Math.random().toString(36).slice(2);
    }

    function addMessage(role, text) {
        var el = document.createElement("div");
        el.className = "widget-msg widget-msg-" + (role === "user" ? "user" : "bot");
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
    }

    function setOpen(value) {
        open = value;
        fab.classList.toggle("hidden", open);
        panel.classList.toggle("hidden", !open);
        try { window.parent.postMessage({ source: "camilius-widget", open: open }, parentOrigin); } catch (e) {}
        if (open && !greeted) {
            greeted = true;
            addMessage("bot", "Hi! Ask me anything about {{ business_name }}, or book a time that works for you.");
            input.focus();
        }
    }

    fab.addEventListener("click", function () { setOpen(true); });
    closeBtn.addEventListener("click", function () { setOpen(false); });

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        var text = input.value.trim();
        if (!text) return;
        input.value = "";
        input.disabled = true;
        addMessage("user", text);
        var typingEl = addMessage("bot", "...");
        typingEl.classList.add("widget-msg-typing");

        fetch(chatUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, session_id: sessionId }),
        })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                typingEl.remove();
                addMessage("bot", data.reply || "Sorry, something went wrong - please try again.");
            })
            .catch(function () {
                typingEl.remove();
                addMessage("bot", "Sorry, something went wrong - please try again.");
            })
            .finally(function () {
                input.disabled = false;
                input.focus();
            });
    });
})();
</script>
</body>
</html>

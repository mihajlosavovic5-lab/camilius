<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Prijava - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 360px; margin: 100px auto; padding: 0 20px; }
        h1 { color: #333; font-size: 1.4em; }
        input { width: 100%; padding: 8px; margin: 6px 0 14px 0; box-sizing: border-box; }
        button { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .greska { color: #c00; }
    </style>
</head>
<body>
    <h1>Prijava na dashboard</h1>

    {% if greska %}
        <p class="greska">{{ greska }}</p>
    {% endif %}

    <form method="POST">
        <label>Korisnicko ime</label>
        <input type="text" name="korisnicko_ime" autofocus>

        <label>Lozinka</label>
        <input type="password" name="lozinka">

        <button type="submit">Prijavi se</button>
    </form>

    <a href="{{ url_for('registracija') }}">Nemas nalog? Registruj svoj biznis</a>
</body>
</html>

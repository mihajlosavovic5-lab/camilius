<nav class="navbar">
    <div class="navbar-inner">
        <span class="brand">
            <span class="brand-mark">C</span>
            <span class="brand-name">Camilius</span>
        </span>
        {% if not minimal_nav %}
        <!-- Hamburger toggle - only shown at phone widths (see .nav-menu-btn in
             style.css); on desktop .nav-links stays inline and this button is hidden.
             Toggling is handled by a delegated document click listener in base.html so
             it keeps working after htmx swaps the nav back in on every boosted nav.
             Same "classic" full-height slide-out drawer as the logged-out landing
             page's own hamburger (.lp-menu-btn/.lp-menu-modal-sheet in style.css) -
             a dimming backdrop behind it, closed by tapping the backdrop, a link, or
             anywhere outside the sheet. -->
        <button type="button" class="nav-menu-btn" id="nav-menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
            <span class="nav-menu-btn-bar"></span>
            <span class="nav-menu-btn-bar"></span>
            <span class="nav-menu-btn-bar"></span>
        </button>
        <div class="nav-menu-backdrop" id="nav-menu-backdrop"></div>
        <!-- hx-boost: these links are fetched via AJAX and swapped into the current
             page's <body> instead of a full browser navigation (htmx handles history/
             back-forward transparently) - only the nav, deliberately, not every link or
             form on the site; see base.html for the vendored htmx script.
             hx-replace-url (not the default push) - switching Conversations/Schedule/
             Profile/Settings replaces the current history entry instead of stacking a
             new one per tab, the same way tapping tabs in the native app itself doesn't
             grow a back-stack. Without this, visiting N tabs before logging out meant N
             stale history entries afterward - each one now correctly bounces back to
             /login rather than showing the account again (see base.html/app.py's
             no-store + historyRestore/pageshow handling), but the visitor had to press
             back N times to get past all of them before reaching anything new, which
             read as "back doesn't do anything." One entry for wherever you currently are
             in the app means one back press is enough to leave it entirely. -->
        <!-- Each label is its own inner span (not just text straight in the <a>, matching
             the Schedule badge's pre-existing pattern below) so the phone-web drawer's
             active-page underline (.nav-link-label, style.css) can hug just the text
             width - the <a> itself stays full-width for a large tap target, but a full-
             width chip meant the shared desktop underline (sized to the <a>, compact
             there since desktop pills already hug their own text) stretched all the way
             across the row instead of sitting under the word like it does on desktop. -->
        <div class="nav-links" id="nav-links" hx-boost="true" hx-replace-url="true">
            <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}"><span class="nav-link-label" data-i18n="common.mySite">My Website</span></a>
            <a href="{{ url_for('schedule') }}" class="nav-link-with-badge {{ 'active' if request.endpoint == 'schedule' }}">
                <span class="nav-link-label" data-i18n="common.schedule">Schedule</span>
            </a>
            <a href="{{ url_for('settings') }}" class="{{ 'active' if request.endpoint == 'settings' }}"><span class="nav-link-label" data-i18n="common.profile">Profile</span></a>
            <!-- Subscription lives inside Settings now (Faza 5), same as the mobile app -
                 not its own top-level nav item anymore, but "active" still applies here
                 too so the Settings link stays highlighted while on /subscription. -->
            <a href="{{ url_for('app_settings') }}" class="{{ 'active' if request.endpoint in ('app_settings', 'subscription') }}"><span class="nav-link-label" data-i18n="common.settings">Settings</span></a>
        </div>
        {% endif %}
    </div>
</nav>

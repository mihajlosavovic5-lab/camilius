<nav class="navbar">
    <div class="navbar-inner">
        <span class="brand">
            <span class="brand-mark">C</span>
            <span class="brand-name">Camilius</span>
        </span>
        {% if not minimal_nav %}
        <!-- hx-boost: these links are fetched via AJAX and swapped into the current
             page's <body> instead of a full browser navigation (htmx handles history/
             back-forward transparently) - only the nav, deliberately, not every link or
             form on the site; see base.html for the vendored htmx script. Log out is
             excluded on purpose further down, same reasoning as the hover-prefetch. -->
        <div class="nav-links" hx-boost="true">
            <a href="{{ url_for('home') }}" class="nav-link-home {{ 'active' if request.endpoint == 'home' }}" aria-label="Home">
                <svg class="nav-home-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 11.5 12 4l9 7.5"></path>
                    <path d="M5.5 9.5V20h13V9.5"></path>
                </svg>
                <span data-i18n="common.home">Home</span>
            </a>
            <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}" data-i18n="common.conversations">Conversations</a>
            <a href="{{ url_for('schedule') }}" class="nav-link-with-badge {{ 'active' if request.endpoint == 'schedule' }}">
                <span data-i18n="common.schedule">Schedule</span>{% if nav_pro_access is sameas false %}<span class="badge badge-pro nav-pro-badge">Pro</span>{% endif %}
            </a>
            <a href="{{ url_for('settings') }}" class="{{ 'active' if request.endpoint == 'settings' }}" data-i18n="common.profile">Profile</a>
            <!-- Subscription lives inside Settings now (Faza 5), same as the mobile app -
                 not its own top-level nav item anymore, but "active" still applies here
                 too so the Settings link stays highlighted while on /subscription. -->
            <a href="{{ url_for('app_settings') }}" class="{{ 'active' if request.endpoint in ('app_settings', 'subscription') }}" data-i18n="common.settings">Settings</a>
            <a href="{{ url_for('logout') }}" class="nav-logout" hx-boost="false" data-i18n="common.logOut">Log out</a>
        </div>
        {% endif %}
    </div>
</nav>

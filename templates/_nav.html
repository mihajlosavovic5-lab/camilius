<nav class="navbar">
    <div class="navbar-inner">
        <span class="brand">
            <span class="brand-mark">C</span>
            <span class="brand-name">Camilius</span>
        </span>
        {% if not minimal_nav %}
        <!-- Hamburger toggle - only shown at phone widths (see .nav-menu-btn in
             style.css); on desktop .nav-links stays inline and this button is hidden.
             Toggling is handled by a delegated document click listener in base.html so
             it keeps working after htmx swaps the nav back in on every boosted nav. -->
        <button type="button" class="nav-menu-btn" id="nav-menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
            <span class="nav-menu-btn-bar"></span>
            <span class="nav-menu-btn-bar"></span>
            <span class="nav-menu-btn-bar"></span>
        </button>
        <!-- hx-boost: these links are fetched via AJAX and swapped into the current
             page's <body> instead of a full browser navigation (htmx handles history/
             back-forward transparently) - only the nav, deliberately, not every link or
             form on the site; see base.html for the vendored htmx script. -->
        <div class="nav-links" id="nav-links" hx-boost="true">
            <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}" data-i18n="common.conversations">Conversations</a>
            <a href="{{ url_for('schedule') }}" class="nav-link-with-badge {{ 'active' if request.endpoint == 'schedule' }}">
                <span data-i18n="common.schedule">Schedule</span>{% if nav_pro_access is sameas false %}<span class="badge badge-pro nav-pro-badge">Pro</span>{% endif %}
            </a>
            <a href="{{ url_for('settings') }}" class="{{ 'active' if request.endpoint == 'settings' }}" data-i18n="common.profile">Profile</a>
            <!-- Subscription lives inside Settings now (Faza 5), same as the mobile app -
                 not its own top-level nav item anymore, but "active" still applies here
                 too so the Settings link stays highlighted while on /subscription. -->
            <a href="{{ url_for('app_settings') }}" class="{{ 'active' if request.endpoint in ('app_settings', 'subscription') }}" data-i18n="common.settings">Settings</a>
        </div>

        <!-- Notification bell - owner appointment reminders (reminders.py) land here
             instead of an email (Faza 12 follow-up); fetched once per page load from
             app.py's session-authed /notifications (mobile has its own Bearer-authed
             /api/notifications, same underlying table). Lives outside .nav-links so
             hx-boost never treats it as a boosted nav link, but it's still part of the
             body htmx swaps on every navigation, so this script re-runs and re-fetches
             fresh on every page, same as the support widget/lang picker in base.html. -->
        <div class="notif-bell" id="notif-bell">
            <button type="button" class="notif-bell-btn" id="notif-bell-btn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" class="notif-bell-icon">
                    <path d="M6 9a6 6 0 1 1 12 0c0 3.5 1 5 2 6H4c1-1 2-2.5 2-6Z" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9.5 18a2.5 2.5 0 0 0 5 0" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <span class="notif-bell-badge hidden" id="notif-bell-badge">0</span>
            </button>
            <div class="notif-bell-panel hidden" id="notif-bell-panel">
                <div class="notif-bell-panel-header" data-i18n="notifications.heading">Notifications</div>
                <div class="notif-bell-panel-list" id="notif-bell-panel-list">
                    <div class="notif-bell-empty" data-i18n="notifications.empty">No notifications yet.</div>
                </div>
            </div>
        </div>
        <script>
        (function () {
            var bell = document.getElementById("notif-bell");
            var btn = document.getElementById("notif-bell-btn");
            var badge = document.getElementById("notif-bell-badge");
            var panel = document.getElementById("notif-bell-panel");
            var list = document.getElementById("notif-bell-panel-list");
            if (!bell || !btn || !panel || !list) return;

            function setUnread(count) {
                if (count > 0) {
                    badge.textContent = count > 9 ? "9+" : String(count);
                    badge.classList.remove("hidden");
                } else {
                    badge.classList.add("hidden");
                }
            }

            function render(items) {
                list.innerHTML = "";
                if (!items.length) {
                    var empty = document.createElement("div");
                    empty.className = "notif-bell-empty";
                    empty.textContent = typeof t === "function" ? t("notifications.empty") : "No notifications yet.";
                    list.appendChild(empty);
                    return;
                }
                items.forEach(function (item) {
                    var row = document.createElement("div");
                    row.className = "notif-bell-item" + (item.read ? "" : " notif-bell-item-unread");
                    var title = document.createElement("div");
                    title.className = "notif-bell-item-title";
                    title.textContent = item.title;
                    var body = document.createElement("div");
                    body.className = "notif-bell-item-body";
                    body.textContent = item.body;
                    row.appendChild(title);
                    row.appendChild(body);
                    list.appendChild(row);
                });
            }

            function load() {
                fetch("{{ url_for('notifications') }}", { credentials: "same-origin" })
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (data) {
                        if (!data) return;
                        render(data.notifications || []);
                        setUnread(data.unread_count || 0);
                    })
                    .catch(function () {});
            }

            btn.addEventListener("click", function (event) {
                event.stopPropagation();
                var open = panel.classList.toggle("open");
                btn.setAttribute("aria-expanded", open ? "true" : "false");
                if (open && !badge.classList.contains("hidden")) {
                    fetch("{{ url_for('mark_notifications_read_route') }}", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token() }}" },
                        body: "{}",
                    }).then(function () { setUnread(0); }).catch(function () {});
                }
            });
            document.addEventListener("click", function (event) {
                if (panel.classList.contains("open") && !bell.contains(event.target)) {
                    panel.classList.remove("open");
                    btn.setAttribute("aria-expanded", "false");
                }
            });

            load();
        })();
        </script>
        {% endif %}
    </div>
</nav>

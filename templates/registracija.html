<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Registracija biznisa</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
        h1 { color: #333; font-size: 1.4em; }
        label { font-weight: bold; display: block; margin-top: 14px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-family: inherit; }
        textarea { min-height: 70px; }
        button { margin-top: 20px; padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .greska { color: #c00; }
        .napomena { color: #666; font-size: 0.85em; }
        a { display: block; margin-top: 16px; }
    </style>
</head>
<body>
    <h1>Registruj svoj biznis</h1>

    {% if greska %}
        <p class="greska">{{ greska }}</p>
    {% endif %}

    <form method="POST">
        <label>Naziv biznisa</label>
        <input type="text" name="naziv" required>

        <label>Korisnicko ime (za prijavu na dashboard)</label>
        <input type="text" name="korisnicko_ime" required>

        <label>Lozinka</label>
        <input type="password" name="lozinka" required>

        <label>Email adresa (Gmail nalog koji ce sistem koristiti)</label>
        <input type="email" name="email_adresa" required>

        <label>Email app password</label>
        <input type="text" name="email_app_password" required>
        <p class="napomena">16-karakterna lozinka iz Google naloga (Security -&gt; 2-Step Verification -&gt; App passwords), ne tvoja obicna Gmail lozinka.</p>

        <label>Radno vreme</label>
        <textarea name="radno_vreme" placeholder="Ponedeljak: 09:00 - 20:00&#10;Subota: 09:00 - 16:00&#10;Nedelja: zatvoreno" required></textarea>

        <label>Cenovnik</label>
        <textarea name="cenovnik" placeholder="Musko sisanje: 800 din&#10;Zensko sisanje: 1500 din" required></textarea>

        <label>Cesta pitanja i odgovori</label>
        <textarea name="cesta_pitanja" placeholder="P: Da li je potrebno zakazati termin?&#10;O: Da, preporucujemo zakazivanje unapred."></textarea>

        <button type="submit">Registruj se</button>
    </form>

    <a href="{{ url_for('login') }}">Vec imas nalog? Prijavi se</a>
</body>
</html>

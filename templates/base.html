<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Camilius{% endblock %}</title>
    <meta name="description" content="{% block description %}Camilius reads your business's Instagram messages and drafts AI-suggested replies based on your working hours, price list, and FAQ - you just review and send.{% endblock %}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon-192.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#d69410">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-512.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_versions['style.css'] }}">
    <!-- htmx (vendored, not CDN-loaded - see static/htmx.min.js) powers hx-boost on the
         main nav (see _nav.html): clicking Conversations/Profile/Settings/Subscription
         fetches the page via AJAX and swaps it into the current <body> instead of a full
         browser navigation, so the shared CSS/JS/head don't get re-fetched and re-parsed
         on every click - a nav click that no longer feels like leaving the app to reload
         a whole new one. Falls back to a completely normal full-page link if JS fails to
         load or an older browser doesn't cooperate - hx-boost only enhances a real <a
         href>, it never replaces it. -->
    <script src="{{ url_for('static', filename='htmx.min.js') }}?v={{ static_versions['htmx.min.js'] }}" defer></script>
    <!-- Site-wide translation layer (static/site-i18n.js) - vanilla JS, same pattern as
         the mobile app's i18n.js. Lives in base.html so the picker button/modal and the
         translate-on-load call apply on every page automatically, without touching each
         template's own header markup. -->
    <script src="{{ url_for('static', filename='site-i18n.js') }}?v={{ static_versions['site-i18n.js'] }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
<!-- Language picker - fixed top-right on every page (same widget as the mobile app's
     login screen: a text+chevron button that opens a dropdown of the same 10 languages).
     Lives outside any page-specific header markup so it works identically whether the
     page uses _nav.html (logged-in) or its own public-header/auth-wrapper. -->
<button type="button" id="site-lang-select-btn" class="site-lang-select-btn">
    <span id="site-lang-select-label">English</span>
    <span class="site-lang-chevron">&#8964;</span>
</button>
<div id="site-lang-modal" class="site-lang-modal">
    <div class="site-lang-modal-backdrop" id="site-lang-modal-backdrop"></div>
    <div class="site-lang-modal-sheet">
        <div id="site-lang-modal-list" class="site-lang-modal-list"></div>
    </div>
</div>
<script>
    // Only inside the installed Android app (never a regular browser tab), and only the
    // first time ever - show the swipeable onboarding slides, regardless of whether the
    // visitor happens to already be logged in (a persisted session shouldn't skip it).
    (function () {
        if (window.location.pathname === "/intro") { return; }
        // display-mode:standalone catches a classic installed PWA; document.referrer
        // starting with "android-app://" is Google's documented way to detect a
        // Trusted Web Activity specifically (our APK's actual wrapper type), since TWA
        // doesn't always reliably report standalone via matchMedia.
        var isStandalone = window.matchMedia("(display-mode: standalone)").matches
            || window.navigator.standalone === true
            || document.referrer.indexOf("android-app://") === 0;
        var introSeen = false;
        try { introSeen = localStorage.getItem("introSeen") === "1"; } catch (e) {}
        if (isStandalone && !introSeen) {
            window.location.replace("{{ url_for('intro') }}");
        }
    })();
</script>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
        });
    }
</script>
<script>
    // Warms up the page a nav link points to as soon as the user's mouse/finger reaches
    // it - before they actually click - so the TCP connection is already open and the
    // server has often already finished rendering by the time the click lands. Scoped
    // deliberately to just the main nav (not every link on the page): this is a
    // navigation-only request, not a click, so it must never be pointed at anything
    // that has a side effect on GET (Log out clears the session immediately) or that
    // triggers a file download (wasted bandwidth, no benefit - downloads don't reuse a
    // background fetch() anyway).
    (function () {
        var warmed = new Set();
        document.querySelectorAll(".nav-links a").forEach((link) => {
            if (link.classList.contains("nav-logout")) return;
            const warm = () => {
                if (warmed.has(link.href)) return;
                warmed.add(link.href);
                fetch(link.href, { credentials: "same-origin" }).catch(() => {});
            };
            link.addEventListener("mouseenter", warm, { passive: true });
            link.addEventListener("touchstart", warm, { passive: true });
        });
    })();
</script>
</body>
</html>

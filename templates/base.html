<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Camilius AI{% endblock %}</title>
    <meta name="description" content="{% block description %}Camilius AI reads your business's emails and drafts AI-suggested replies based on your working hours, price list, and FAQ - you just review and send.{% endblock %}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f2b736'/%3E%3Ccircle cx='50' cy='50' r='39' fill='none' stroke='%232b2013' stroke-width='2' stroke-dasharray='5 5' opacity='0.45'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle' fill='%232b2013' font-family='Georgia,serif' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#9a3a24">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-512.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Camilius AI{% endblock %}</title>
    <meta name="description" content="{% block description %}Camilius AI reads your business's emails and drafts AI-suggested replies based on your working hours, price list, and FAQ - you just review and send.{% endblock %}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23ffd83d'/%3E%3Ccircle cx='50' cy='50' r='39' fill='none' stroke='%232b2013' stroke-width='2' stroke-dasharray='5 5' opacity='0.45'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle' fill='%23ffffff' font-family='Georgia,serif' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#9a3a24">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-512.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
<script>
    // Only inside the installed Android app (never a regular browser tab), and only the
    // first time ever - show the swipeable onboarding slides, regardless of whether the
    // visitor happens to already be logged in (a persisted session shouldn't skip it).
    (function () {
        if (window.location.pathname === "/intro") { return; }
        // display-mode:standalone catches a classic installed PWA; document.referrer
        // starting with "android-app://" is Google's documented way to detect a
        // Trusted Web Activity specifically (our APK's actual wrapper type), since TWA
        // doesn't always reliably report standalone via matchMedia.
        var isStandalone = window.matchMedia("(display-mode: standalone)").matches
            || window.navigator.standalone === true
            || document.referrer.indexOf("android-app://") === 0;
        var introSeen = false;
        try { introSeen = localStorage.getItem("introSeen") === "1"; } catch (e) {}
        if (isStandalone && !introSeen) {
            window.location.replace("{{ url_for('intro') }}");
        }
    })();
</script>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
        });
    }
</script>
</body>
</html>

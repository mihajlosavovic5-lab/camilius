{% extends "base.html" %}
{% block title %}{{ kod }} - ai-auto-reply{% endblock %}
{% block body_klasa %}auth{% endblock %}

{% block telo %}
<div class="auth-omotac">
    <div class="auth-brend">
        <span class="brand">
            <span class="brand-mark">ai</span>
            <span class="brand-name">auto-reply</span>
        </span>
    </div>

    <div class="auth-karta" style="text-align: center;">
        <div style="font-size: 44px; font-weight: 800; color: var(--primarna); letter-spacing: -2px;">{{ kod }}</div>
        <p style="color: var(--tekst-blagi); margin: 8px 0 20px;">{{ poruka }}</p>
        <a href="{{ url_for('pocetna') }}" class="dugme" style="text-decoration: none;">Nazad na pocetnu</a>
    </div>
</div>
{% endblock %}
